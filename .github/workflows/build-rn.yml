# Builds the React Native TripArro app (Expo) for Android on GitHub's computers.
# Every push to the react-native branch builds a release APK and app bundle; they are saved on the "rn-builds" branch.
# The files are signed with the upload key outside GitHub. The Google Maps key is given only when a build is started by hand.
name: Build React Native Android app

on:
  workflow_dispatch:
    inputs:
      maps_api_key:
        description: 'Google Maps Android key for this build'
        required: false
        default: ''
  push:
    branches: [react-native]
    paths-ignore: ['**.md', '.github/workflows/screens-rn.yml', '.github/workflows/publish-rn.yml', 'tool/design-shots.sh']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Make the Android project
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || github.event.inputs.maps_api_key }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then echo "::add-mask::$MAPS_API_KEY"; echo "Google Maps key: set"; else echo "Google Maps key: not set"; fi
          export BUILD_NUMBER=${{ github.run_number }}
          npx expo prebuild --platform android --no-install --clean
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g\nreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64\n' >> android/gradle.properties
          # one small APK per phone type (arm64 = almost every phone today; x86_64 = the emulator); the app bundle keeps all of them
          printf '\nandroid { splits { abi { enable true; reset(); include "arm64-v8a", "armeabi-v7a", "x86_64"; universalApk false } } }\n' >> android/app/build.gradle
      - name: Build APK and app bundle
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || github.event.inputs.maps_api_key }}
        run: |
          export BUILD_NUMBER=${{ github.run_number }}
          mkdir -p logs
          set -o pipefail
          cd android && ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee ../logs/build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: triparro-rn
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          compression-level: 0
      - name: Save the build log to the rn-builds branch
        if: always()
        run: |
          N=${{ github.run_number }}
          mkdir -p /tmp/out/logs
          cp logs/*.log /tmp/out/logs/ 2>/dev/null || true
          grep -E "error|FAILURE|What went wrong|Could not|> " logs/build.log | head -200 > /tmp/out/logs/errors.txt 2>/dev/null || true
          ls -la android/app/build/outputs/apk/release/ android/app/build/outputs/bundle/release/ > /tmp/out/files.txt 2>&1 || true
          printf 'Version 3.0.%s (code %s)\nCommit %s\nResult: %s\n' "$N" "$((1000 + N))" "${{ github.sha }}" "${{ job.status }}" > /tmp/out/BUILD-INFO.txt
          cd /tmp/out
          git init -q && git checkout -q -b rn-builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "RN build 3.0.$N - ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rn-builds

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: triparro-rn
          path: out
      - name: Get the emulator APK
        run: |
          find out -name '*.apk' | tee /dev/stderr
          cp "$(find out -name '*x86_64*.apk' | head -1)" app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: mkdir -p screens && bash tool/screens.sh > screens/run.log 2>&1 || true
      - name: Save screenshots
        if: always()
        run: |
          rm -rf /tmp/nb && git clone -q --depth 1 -b rn-builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/nb
          rm -rf /tmp/nb/screens && mkdir -p /tmp/nb/screens
          cp -r screens/. /tmp/nb/screens/ 2>/dev/null || echo "nothing" > /tmp/nb/screens/none.txt
          cd /tmp/nb && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Screenshots ${{ github.run_number }}" && git push origin rn-builds
