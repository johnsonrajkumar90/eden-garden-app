# Builds the Android app on GitHub's computers — no Flutter or Android Studio needed on your side.
#
#   Push this project to a GitHub repository (private is fine) → Actions tab → "Build Android app" → Run workflow.
#   When it finishes, download "eden-garden-android" at the bottom of the run page:
#     app-release.aab  → upload to Google Play Console
#     app-release.apk  → install directly on a phone to test
#
# Signing (required for Google Play): add these 4 repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   contents of upload-keystore.base64.txt
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         upload
#   ANDROID_KEY_PASSWORD
# Without them the build still works, but is signed with a throw-away debug key (fine for testing only).

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'store/**']

permissions:
  contents: write   # to save the finished files on the "builds" branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: mkdir -p logs && set -o pipefail && flutter pub get 2>&1 | tee logs/1-pub-get.log

      - name: Check the code
        run: set -o pipefail && flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee logs/2-analyze.log

      - name: Run tests
        run: set -o pipefail && flutter test 2>&1 | tee logs/3-test.log

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets — building with the debug key. Google Play will NOT accept this build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "Signing with the upload key."

      # The build number goes up by one on every run, so every build can be uploaded to Google Play.
      # The version name (1.0.0) comes from pubspec.yaml.
      - name: Build app bundle (.aab) for Google Play
        run: set -o pipefail && flutter build appbundle --release --build-number=$((100 + ${{ github.run_number }})) 2>&1 | tee logs/4-build-aab.log

      - name: Build APK for testing on a phone
        run: set -o pipefail && flutter build apk --release --build-number=$((100 + ${{ github.run_number }})) 2>&1 | tee logs/5-build-apk.log

      - name: Collect files
        run: |
          mkdir -p out
          cp build/app/outputs/bundle/release/app-release.aab out/
          cp build/app/outputs/flutter-apk/app-release.apk out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: eden-garden-android
          path: out/
          retention-days: 30

      # Keep the latest files (or, if something failed, the logs) on the "builds" branch
      - name: Save to the builds branch
        if: always() && github.event_name != 'pull_request'
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          BUILD=$((100 + ${{ github.run_number }}))
          mkdir -p /tmp/builds/logs
          cp logs/*.log /tmp/builds/logs/ 2>/dev/null || true
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && cp build/app/outputs/flutter-apk/app-release.apk "/tmp/builds/eden-garden-$VER-$BUILD.apk"
          [ -f build/app/outputs/bundle/release/app-release.aab ] && cp build/app/outputs/bundle/release/app-release.aab "/tmp/builds/eden-garden-$VER-$BUILD.aab"
          printf 'Version %s (build %s)\nCommit %s\nResult: %s\nSigned with upload key: %s\n' "$VER" "$BUILD" "${{ github.sha }}" "${{ job.status }}" "${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" > /tmp/builds/BUILD-INFO.txt
          cd /tmp/builds
          git init -q && git checkout -q -b builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Build $VER ($BUILD) - ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
