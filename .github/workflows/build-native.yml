# Builds the native TripArro Android app (Kotlin + Jetpack Compose) on GitHub's computers.
# Every push to the native-app branch builds a new APK; the APK and the build log are saved on the
# "native-builds" branch (and as a run artifact). Signing uses the same 4 secrets as the earlier app:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build native Android app

on:
  workflow_dispatch:
  push:
    branches: [native-app]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No signing secrets — debug key."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > key.properties

      - name: Build APK and app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p logs
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee logs/build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: triparro-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Save to the native-builds branch
        if: always()
        run: |
          mkdir -p /tmp/out/logs
          cp logs/*.log /tmp/out/logs/ 2>/dev/null || true
          # keep only the compiler errors at the top of a short log, so a failed build is easy to read
          grep -E "^e: |error:|FAILURE|What went wrong|Could not|> " logs/build.log | head -200 > /tmp/out/logs/errors.txt 2>/dev/null || true
          N=${{ github.run_number }}
          for f in app/build/outputs/apk/release/*.apk; do [ -f "$f" ] && cp "$f" "/tmp/out/triparro-2.0.$N.apk"; done
          for f in app/build/outputs/bundle/release/*.aab; do [ -f "$f" ] && cp "$f" "/tmp/out/triparro-2.0.$N.aab"; done
          printf 'Version 2.0.%s (code %s)\nCommit %s\nResult: %s\n' "$N" "$((300 + N))" "${{ github.sha }}" "${{ job.status }}" > /tmp/out/BUILD-INFO.txt
          cd /tmp/out
          git init -q && git checkout -q -b native-builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Native build 2.0.$N - ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" native-builds

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app
      - name: Get the APK
        run: |
          git fetch origin native-builds --depth 1
          mkdir -p out && git --work-tree=out checkout origin/native-builds -- .
          ls -la out
          cp $(ls out/*.apk | sort -V | tail -1) app.apk
          # a release-signed APK to check (signed outside GitHub with the upload key), if there is one
          if git fetch origin release-check --depth 1 2>/dev/null; then git show origin/release-check:release.apk > release.apk 2>/dev/null || rm -f release.apk; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: mkdir -p screens && bash tool/screens.sh > screens/run.log 2>&1 || true; bash tool/release-check.sh || true
      - name: Save screenshots
        if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          rm -rf /tmp/nb && git clone -q --depth 1 -b native-builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/nb
          ls -la screens || echo "no screens folder"
          rm -rf /tmp/nb/screens && mkdir -p /tmp/nb/screens
          cp -r screens/. /tmp/nb/screens/ 2>/dev/null || echo "nothing to copy" > /tmp/nb/screens/none.txt
          date > /tmp/nb/screens/when.txt
          cd /tmp/nb && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Screenshots ${{ github.run_number }}" && git push origin native-builds
