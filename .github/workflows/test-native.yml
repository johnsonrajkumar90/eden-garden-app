# Installs the latest native APK on an Android emulator, opens the main screens and saves screenshots
# (and any crash log) on the "native-builds" branch under screens/. Run it from the Actions tab.
name: Test native Android app

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build native Android app"]
    types: [completed]

permissions:
  contents: write

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-app
      - name: Get the APK
        run: |
          git fetch origin native-builds --depth 1
          mkdir -p out && git --work-tree=out checkout origin/native-builds -- .
          ls -la out
          cp $(ls out/*.apk | sort -V | tail -1) app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/screens.sh
      - name: Save screenshots
        if: always()
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          rm -rf /tmp/nb && git clone -q --depth 1 -b native-builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/nb
          rm -rf /tmp/nb/screens && mkdir -p /tmp/nb/screens && cp -r screens/* /tmp/nb/screens/ 2>/dev/null || true
          cd /tmp/nb && git add -A && git commit -qm "Screenshots ${{ github.run_number }}" && git push -q origin native-builds || true
