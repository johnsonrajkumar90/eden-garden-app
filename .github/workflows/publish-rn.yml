# Copies the APKs and app bundle of a finished build run to the rn-builds-files branch (the app bundle in parts under
# GitHub's 100 MB file limit; join them with: cat triparro.aab.part-* > triparro.aab).
name: Save React Native build files

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run number (id) to copy the files from'
        required: true
  push:
    branches: [react-native]
    paths: ['.github/workflows/publish-rn.yml']

permissions:
  contents: write
  actions: read

jobs:
  copy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: triparro-rn
          path: in
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Save to the rn-builds-files branch
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          find "$GITHUB_WORKSPACE/in" -name '*.apk' -exec cp {} . \;
          AAB=$(find "$GITHUB_WORKSPACE/in" -name '*.aab' | head -1)
          [ -n "$AAB" ] && split -b 90m -d "$AAB" triparro.aab.part-
          sha256sum * > SHA256SUMS.txt
          [ -n "$AAB" ] && sha256sum "$AAB" | sed 's#  .*#  triparro.aab#' >> SHA256SUMS.txt
          echo "From run ${{ github.event.inputs.run_id }}" > FROM.txt
          git init -q && git checkout -q -b rn-builds-files
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Files of run ${{ github.event.inputs.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rn-builds-files
