# Takes design screenshots of an already built app (no new build): give the build run id.
name: React Native design screenshots
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run id whose APK to use'
        required: true
  push:
    branches: [react-native]
    paths: ['.github/workflows/screens-rn.yml']
permissions:
  contents: write
  actions: read
jobs:
  shots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: triparro-rn
          path: out
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cp "$(find out -name '*x86_64*.apk' | head -1)" app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/design-shots.sh > run.log 2>&1 || true
      - name: Save screenshots
        if: always()
        run: |
          mkdir -p /tmp/s && cp -r screens/. /tmp/s/ 2>/dev/null; cp run.log /tmp/s/ 2>/dev/null || true
          cd /tmp/s && git init -q && git checkout -q -b rn-design-shots
          git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Design shots"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rn-design-shots
