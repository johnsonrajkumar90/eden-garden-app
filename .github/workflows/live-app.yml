name: Run the app against the live site
on:
  workflow_dispatch:
  push:
    branches: [live-app]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest APK
        run: |
          git fetch origin native-builds --depth 1
          mkdir -p out && git --work-tree=out checkout origin/native-builds -- .
          cp $(ls out/*.apk | sort -V | tail -1) app.apk && ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash tool/live-app.sh > live-run.log 2>&1 || true
      - name: Keep the results
        if: always()
        run: |
          rm -rf /tmp/lr && mkdir -p /tmp/lr && cp -r live live-run.log /tmp/lr/ 2>/dev/null || true
          cd /tmp/lr && git init -q && git checkout -q -b live-results && git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Live app run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-results
